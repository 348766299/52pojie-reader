name: 构建 Android APK

# 推送到 main / master 或手动触发时，云端编译 debug APK：
# 既上传 Actions 产物，也发布到 Releases（手机浏览器可直接下载安装）。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可并安装编译组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: 启用 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 补齐 Gradle Wrapper JAR
        # 仓库以纯文本托管，二进制 jar 在 CI 中从 Gradle 官方仓库获取，
        # 避免把二进制文件提交进 Git，也保证 ./gradlew 可直接使用。
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL --retry 3 --max-time 120 \
            -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: 构建 APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: wuai-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          APK="wuai-reader-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --title "吾爱阅读 ${TAG}" \
            --notes "由 GitHub Actions 从 ${GITHUB_SHA::7} 自动构建，debug 签名，可直接安装。" \
            || gh release upload "$TAG" "$APK" --clobber
