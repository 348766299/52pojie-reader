name: 构建 Android APK

# 推送到 main / master 或手动触发时，云端编译 debug APK：
# 既上传 Actions 产物，也发布到 Releases（手机浏览器可直接下载安装）。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管 runner 已预装 Android SDK 与 cmdline-tools。
      # 不使用 setup-android@v3：该 action 会尝试安装早已下线的 `tools` 包，
      # 导致 sdkmanager 退出码 1（Failed to find package 'tools'）。
      - name: 接受 SDK 许可并安装编译组件
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          echo "ANDROID_HOME=$SDK"
          echo "sdkmanager=$SDKM"
          test -n "$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: 启用 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 确认 Gradle Wrapper 可用
        shell: bash
        run: |
          set -e
          # 仓库已包含 wrapper jar；仅在缺失时补下载，避免额外网络依赖。
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -fsSL --retry 3 --max-time 120 \
              -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: 构建 APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 上传 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: wuai-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.1-build.${{ github.run_number }}"
          APK="wuai-reader-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --title "吾爱阅读 ${TAG}" \
            --notes "由 GitHub Actions 从 ${GITHUB_SHA::7} 自动构建，debug 签名，可直接安装。" \
            || gh release upload "$TAG" "$APK" --clobber
