plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.read52.app'
    compileSdk 34

    defaultConfig {
        applicationId "cn.read52.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // 纯原生实现，不依赖任何 AndroidX / 第三方库
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 刻意留空：只用 Android 原生 API，减少构建失败点、缩小 APK 体积
}
